<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=Roboto:wght@100;300&display=swap');
        
        *,
        *:after,
        *:before {
          box-sizing: border-box;
          transform-style: preserve-3d;
        }
        
        :root {
          --shadow: hsl(0 0% 0% / 0.9);
          --bg: hsl(0 0% 70%);
          --header: hsl(0 0% 65%);
          --lit-header: hsl(0 0% 100%);
          --swing-x: 0;
          --swing-y: 0;
          color-scheme: dark only;
        }
        
        body {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          gap: 1rem;
          background: var(--bg);
          font-family: 'Roboto', 'SF Pro Text', 'SF Pro Icons', 'AOS Icons',
            'Helvetica Neue', Helvetica, Arial, sans-serif, system-ui;
          perspective: 1200px;
          margin: 0;
          cursor: none;
          overflow: hidden;
        }
        
        body::before {
          --size: 45px;
          --line: color-mix(in lch, canvas, transparent 85%);
          content: '';
          height: 100vh;
          width: 100vw;
          position: fixed;
          background: linear-gradient(
                90deg,
                var(--line) 1px,
                transparent 1px var(--size)
              )
              50% 50% / var(--size) var(--size),
            linear-gradient(var(--line) 1px, transparent 1px var(--size)) 50% 50% /
              var(--size) var(--size);
          mask: linear-gradient(-35deg, transparent 30%, white);
          top: 0;
          transform-style: flat;
          pointer-events: none;
          z-index: -1;
        }
        
        p {
          font-weight: 100;
        }
        
        h1 {
          font-size: clamp(5rem, 40vmin, 20rem);
          font-family: 'Open Sans', sans-serif;
          margin: 0;
          letter-spacing: 1rem;
          transform: translate3d(0, 0, 0vmin);
          --x: calc(var(--swing-x) * 1%);
          --y: calc(var(--swing-y) * 1%);
          background: radial-gradient(circle at var(--x) var(--y), 
                    var(--lit-header), var(--header) 45%) 
                    50% 50%/200% 200%;
          -webkit-background-clip: text;
          color: transparent;
        }
        
        h1 span {
          position: absolute;
          top: 0;
          left: 0;
          color: var(--shadow);
          filter: blur(1.5vmin);
          transform: scale(1.05) translate3d(0, 12%, -10vmin)
            translate(
              calc(var(--swing-x) * 0.05px),
              calc(var(--swing-y) * -0.025px)
            );
        }
        
        .cloak {
          height: 100%;
          width: 100%;
          transform-origin: 50% 50%;
          transform: rotate(calc(var(--swing-x) * -0.02deg));
          background: radial-gradient(
            circle at calc(50% + var(--swing-x) * 0.3%) calc(50% + var(--swing-y) * 0.3%),
            transparent,
            hsl(0 0% 2% / 0.94) 38vmax
          );
        }
        
        .cloak__wrapper {
          position: fixed;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        
        .cloak__container {
          height: 250vmax;
          width: 250vmax;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
        
        .info {
          color: color-mix(in lch, canvasText, transparent 75%);
          text-align: center;
          line-height: 1.5;
          width: 44ch;
          max-width: calc(100% - 2rem);
          display: flex;
          flex-direction: column;
          gap: 1rem;
          transition: color 0.25s ease;
        }
        
        .info:is(:hover, :focus-within) {
          color: canvasText;
        }
        
        .info p {
          --x: calc(var(--swing-x) * 1%);
          --y: calc(var(--swing-y) * 1%);
          background: radial-gradient(
            circle at var(--x) var(--y),
            color-mix(in lch, canvasText, transparent 25%),
            color-mix(in lch, canvasText, transparent 75%)
          );
          -webkit-background-clip: text;
          color: transparent;
        }
        
        p::selection {
          background: hotpink;
          color: canvas;
        }
        
        .linkedin {
          border-radius: 6px;
          background-color: rgba(255, 255, 255, 0.2);
          border: 2px solid currentColor;
          padding: 0.75rem 4rem;
          text-decoration: none;
          font-weight: 600;
          letter-spacing: 2px;
          font-size: 1rem;
          align-self: center;
          outline-color: currentColor;
          transition: all 0.3s ease;
          display: block;
          position: relative;
          transform-style: preserve-3d;
          transform: translate3d(0, 0, 40px);
          --x: calc(var(--swing-x) * 1%);
          --y: calc(var(--swing-y) * 1%);
          background: radial-gradient(
            circle at var(--x) var(--y), 
            var(--lit-header), 
            rgba(255, 255, 255, 0.4) 45%
          );
          -webkit-background-clip: text;
          color: transparent;
        }
        
        .linkedin-shadow {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border-radius: 6px;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: rgba(0, 0, 0, 0.7);
          color: var(--shadow);
          filter: blur(4px);
          font-weight: 600;
          letter-spacing: 2px;
          font-size: 1rem;
          padding: 0.75rem 4rem;
          transform: translate3d(0, 0, -40px) 
            translate(
              calc(var(--swing-x) * 0.05px),
              calc(var(--swing-y) * 0.025px)
            );
          transition: all 0.3s ease;
          backface-visibility: hidden;
        }
        
        .button-wrapper:hover .linkedin {
          transform: translate3d(0, -5px, 40px);
        }
        
        .button-wrapper:hover .linkedin-shadow {
          transform: translate3d(0, 7px, -40px)
            translate(
              calc(var(--swing-x) * 0.07px),
              calc(var(--swing-y) * 0.04px)
            );
          filter: blur(6px);
        }
        
        .button-wrapper:active .linkedin {
          transform: translate3d(0, 0, 40px);
        }
        
        .button-wrapper:active .linkedin-shadow {
          transform: translate3d(0, 2px, -40px)
            translate(
              calc(var(--swing-x) * 0.05px),
              calc(var(--swing-y) * 0.025px)
            );
        }
        
        /* Links should have a visible hover state */
        a:hover {
          opacity: 0.8;
        }
        
        /* Button pop-in animation */
        @keyframes popIn {
          0% {
            transform: scale(0);
            opacity: 0;
          }
          70% {
            transform: scale(1.1);
            opacity: 1;
          }
          100% {
            transform: scale(1);
            opacity: 1;
          }
        }
        
        .button-wrapper {
          position: relative;
          transform-style: preserve-3d;
          perspective: 500px;
        }
    </style>
</head>
<body>
    <h1>
      404
      <span aria-hidden="true">404</span>
    </h1>
    <div class="cloak__wrapper">
      <div class="cloak__container">
        <div class="cloak"></div>
      </div>
    </div>
    <div class="info">
      <p>
        Website is still on its way to be built.<br>
        Please wait several weeks until its finished.<br>
        -Sultan-
      </p>
      <div class="button-wrapper">
        <a
          class="linkedin"
          href="https://www.linkedin.com/in/sultan-aldeiro-putra-kumala-008304289/"
          target="_blank"
          rel="noreferrer noopener"
          >CHECK THIS INSTEAD</a
        >
        <span class="linkedin-shadow" aria-hidden="true">CHECK THIS INSTEAD</span>
      </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 200 - 100;
            const y = (e.clientY / window.innerHeight) * 200 - 100;
            
            document.documentElement.style.setProperty('--swing-x', x);
            document.documentElement.style.setProperty('--swing-y', y);
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                
                const x = (touch.clientX / window.innerWidth) * 200 - 100;
                const y = (touch.clientY / window.innerHeight) * 200 - 100;
                
                document.documentElement.style.setProperty('--swing-x', x);
                document.documentElement.style.setProperty('--swing-y', y);
            }
        });
        
        let mouseActive = false;
        
        document.addEventListener('mousemove', () => {
            mouseActive = true;
            clearTimeout(window.mouseTimeout);
            window.mouseTimeout = setTimeout(() => {
                mouseActive = false;
                document.documentElement.style.setProperty('--swing-x', 0);
                document.documentElement.style.setProperty('--swing-y', 0);
            }, 5000);
        });
    </script>
</body>
</html>
